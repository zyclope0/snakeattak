name: Publier le site
# Lancé à la main seulement (onglet Actions, « Run workflow ») : jamais à une poussée. Compile
# le site depuis Git et l'envoie sur l'hébergement Infomaniak. Marche à suivre, secrets à
# créer et retour arrière : docs/SITE.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche, étiquette ou commit à publier'
        required: true
        default: main
      confirmation:
        description: 'Écrire PUBLIER pour confirmer'
        required: true
      prune:
        description: 'Retirer aussi du serveur les fichiers que ce build ne contient plus'
        type: boolean
        default: false
      urgence:
        description: "Retour arrière d'urgence : publier un commit de main même sans CI complète verte"
        type: boolean
        default: false
permissions:
  contents: read
  # Pour lire le résultat de la CI complète du commit publié.
  actions: read
concurrency:
  group: publier-le-site
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirmation
        if: ${{ inputs.confirmation != 'PUBLIER' }}
        run: |
          echo "La publication n'est pas confirmée : écrire PUBLIER dans le champ de confirmation."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Tout l'historique : il faut savoir si le commit est dans main.
          fetch-depth: 0
      # Rien ne part d'une branche de travail, ni d'un commit dont les recettes n'ont pas
      # tourné : seule la CI complète d'une poussée sur main les lance toutes.
      - name: Le commit est dans main et sa CI complète est verte
        env:
          GH_TOKEN: ${{ github.token }}
          URGENCE: ${{ inputs.urgence }}
          DEPOT: ${{ github.repository }}
        run: |
          commit="$(git rev-parse HEAD)"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$commit" FETCH_HEAD; then
            echo "Le commit $commit n'est pas dans main : rien n'est publié."
            exit 1
          fi
          # Si GitHub ne répond pas, on ne sait pas : c'est non, sauf « urgence ».
          vertes="$(gh api "repos/$DEPOT/actions/workflows/check.yml/runs?head_sha=$commit&event=push&branch=main&status=success" --jq '.total_count' || echo inconnu)"
          case "$vertes" in '' | *[!0-9]*) vertes=inconnu ;; esac
          echo "CI complète verte sur main pour $commit : $vertes passage(s)."
          if [ "$vertes" != inconnu ] && [ "$vertes" -ge 1 ]; then exit 0; fi
          if [ "$URGENCE" = "true" ]; then
            echo "Publication d'urgence demandée : on continue sans CI complète verte."
            exit 0
          fi
          if [ "$vertes" = inconnu ]; then
            echo "GitHub n'a pas dit si la CI complète est verte : rien n'est publié. Relancer plus tard."
            exit 1
          fi
          echo "Aucune CI complète verte sur main pour ce commit : rien n'est publié."
          echo "Attendre la fin de « Verify game » sur main, ou cocher « urgence » pour un retour arrière."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Format, tests unitaires et build : rien n'est envoyé si l'un d'eux échoue.
      - run: npm run verify
      - name: Marquer le build
        run: |
          printf '{"commit":"%s","ref":"%s","version":"%s"}\n' \
            "$(git rev-parse HEAD)" "${{ inputs.ref }}" "$(node -p "require('./package.json').version")" \
            > dist/version.json
          cat dist/version.json
      - name: Préparer la connexion
        env:
          SSH_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
          SSH_HOST: ${{ secrets.INFOMANIAK_SSH_HOST }}
        run: |
          test -n "$SSH_KEY" && test -n "$SSH_HOST" || { echo "Secrets INFOMANIAK_* absents : voir docs/SITE.md."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -t ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Envoyer le site
        env:
          SSH_HOST: ${{ secrets.INFOMANIAK_SSH_HOST }}
          SSH_USER: ${{ secrets.INFOMANIAK_SSH_USER }}
          SITE_PATH: ${{ secrets.INFOMANIAK_SITE_PATH }}
        run: |
          test -n "$SSH_USER" && test -n "$SITE_PATH" || { echo "Secrets INFOMANIAK_* absents : voir docs/SITE.md."; exit 1; }
          # Les fichiers arrivent d'abord à côté, puis prennent leur place ensemble. Sans
          # « prune », rien n'est retiré du serveur : une page ouverte pendant l'envoi trouve
          # encore ses anciens fichiers.
          rsync --recursive --links --times --compress --delay-updates \
            ${{ inputs.prune && '--delete-after --exclude=.well-known/ --exclude=.user.ini' || '' }} \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$SITE_PATH/"
      - name: Vérifier le site en ligne
        run: node scripts/check-live-site.mjs https://snakeattacktd.com "$(git rev-parse HEAD)"
      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deploy
