name: Verify game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # The 17 steps take 29 to 44 minutes depending on the runner: leave room for a slow one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      # System packages come from Ubuntu's mirrors, which are sometimes unreachable from the
      # runner. The runner image already carries Chromium's libraries, so fall back to the
      # browser alone instead of failing before any test has run.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:browser
      - run: npm run test:audit
      - run: npm run test:threat-preparation
      - run: npm run test:reinforcements-scroll
      - run: npm run test:child-mobile
      - run: npm run test:interruptions
      - run: npm run test:offline
      - run: npm run test:presentation
      - run: npm run test:tactical-clarity
      - run: npm run test:locale
      - run: npm run test:caprices
      - run: npm run test:mission-journey
      - run: npm run test:mobile-menus
      - run: npm run build:portable
      - run: npm run test:family
      - run: GAME_URL="file://$PWD/dist-portable/index.html" npm run test:browser
