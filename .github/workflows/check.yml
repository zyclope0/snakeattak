name: Verify game
# Une fois par commit : à chaque PR, et sur main après une fusion. « portée » d'abord
# (quelques secondes), puis sept tâches en parallèle au lieu d'une file de 17 étapes : la
# plus longue fixe la durée de l'ensemble. Huit vérifications à lire sur une PR de code.
# Une fusion dans main ne refait pas la CI complète quand la PR l'a déjà passée, verte, sur
# exactement le même code (même arbre) : décision du parent du 25 novembre 2026, pour les
# minutes facturées. Le moindre doute, et tout tourne.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  # Lire l'arbre vérifié par la CI d'une PR, pour la fusion qui suit.
  actions: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  # Un nouveau commit sur une PR remplace la vérification du précédent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portee:
    # Une PR qui ne touche que des documents (`*.md` à la racine ou sous `docs/`, hors
    # `docs/publication/`, le dossier Play, par prudence) ne lance que `npm run verify` :
    # format, tests unitaires, build. Tout le reste, et toute fusion dans main, lance tout.
    # Dans le doute tout tourne : les tâches ne sautent que si « complet » vaut `false`.
    name: portée
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      complet: ${{ steps.fichiers.outputs.complet }}
      deja: ${{ steps.deja.outputs.deja }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit de fusion d'une PR et ses deux parents : le premier est la base.
          fetch-depth: 2
      # Une fusion dans main : la CI complète d'une PR de ce dépôt, verte, a-t-elle vérifié
      # exactement cet arbre ? Elle l'a écrit dans son artefact « arbre-verifie ». Une
      # poussée directe, une fusion par écrasement, une base qui a bougé, une réponse
      # absente de GitHub : « deja » reste `false` et tout tourne.
      - id: deja
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          deja=false
          arbre=$(git rev-parse 'HEAD^{tree}')
          if tete=$(git rev-parse -q --verify 'HEAD^2'); then
            executions=$(gh api "repos/$DEPOT/actions/workflows/check.yml/runs?event=pull_request&head_sha=$tete&status=success&per_page=20" \
              --jq ".workflow_runs[] | select(.head_repository.full_name == \"$DEPOT\") | .id" || true)
            for execution in $executions; do
              rm -rf verifie
              if gh run download "$execution" -R "$DEPOT" -n arbre-verifie -D verifie \
                && [ "$(cat verifie/arbre.txt)" = "$arbre" ]; then
                deja=true
                echo "Arbre $arbre déjà vérifié, vert, par la CI complète de la PR (exécution $execution)."
                break
              fi
            done
          fi
          echo "deja=$deja" | tee -a "$GITHUB_OUTPUT"
      - id: fichiers
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          complet=true
          if [ "$EVENEMENT" = pull_request ]; then
            # Sans détection des renommages : un fichier déplacé vers docs/ montre aussi
            # l'endroit d'où il vient.
            fichiers=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf '%s\n' "$fichiers"
            if [ -n "$fichiers" ] && ! grep -qvE '^([^/]+|docs/.+)\.md$' <<<"$fichiers" \
              && ! grep -q '^docs/publication/' <<<"$fichiers"; then
              complet=false
            fi
          fi
          echo "complet=$complet" | tee -a "$GITHUB_OUTPUT"
  verify:
    # Format, tests unitaires, build, puis le jeu dans le navigateur sous ses deux formes.
    needs: portee
    if: needs.portee.outputs.deja != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPLET: ${{ needs.portee.outputs.complet }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: env.COMPLET != 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: env.COMPLET != 'false'
        run: npm run test:android-signatures
      - if: env.COMPLET != 'false'
        run: npm audit --omit=dev --audit-level=high
      # Ubuntu already carries Chromium's system libraries. Probe first instead of
      # blocking every release on an unnecessary package-mirror update.
      - if: env.COMPLET != 'false'
        uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - if: env.COMPLET != 'false'
        run: npm run test:browser
      - if: env.COMPLET != 'false'
        run: npm run test:discovery
      - if: env.COMPLET != 'false'
        run: npm run build:ads-preview
      - if: env.COMPLET != 'false'
        run: npm run test:ads-preview
      - if: env.COMPLET != 'false'
        run: npm run build:ads-test
      - if: env.COMPLET != 'false'
        run: npm run test:ads-delivery
      - if: env.COMPLET != 'false'
        run: npm run build:android
      - if: env.COMPLET != 'false'
        run: npm run test:android-web
      - if: env.COMPLET != 'false'
        run: npm run build:portable
      - if: env.COMPLET != 'false'
        run: npm run test:family
      - if: env.COMPLET != 'false'
        run: GAME_URL="file://$PWD/dist-portable/index.html" npm run test:browser
      # La CI complète d'une PR écrit l'arbre qu'elle vérifie : une exécution n'est verte que si
      # toutes ses tâches le sont, et la fusion qui suit ne lit que les exécutions vertes.
      - if: env.COMPLET != 'false' && github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > arbre.txt
      - if: env.COMPLET != 'false' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: arbre-verifie
          path: arbre.txt
          retention-days: 7
  recettes:
    # Les recettes navigateur, réparties en groupes. `test:render` reste un outil à lancer à
    # la main : il mesure une vitesse, qui dépend de la machine.
    needs: portee
    if: needs.portee.outputs.complet != 'false' && needs.portee.outputs.deja != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `site` : le groupe lit le site construit (`vite preview`). Les autres servent les
        # sources, ou construisent eux-mêmes (`test:caprices`).
        include:
          - groupe: écrans
            site: true
            recettes: >-
              test:audit test:threat-preparation test:reinforcements-scroll test:child-mobile
              test:interruptions test:offline test:presentation test:tactical-clarity
              test:mission-journey test:endless
          - groupe: langue et caprices
            recettes: test:locale test:caprices
          # La recette des menus est la plus longue : la partie « voyage » pèse à peu près
          # autant que toutes les autres, elle a sa tâche. L'autre prend « tout sauf voyage » :
          # une partie ajoutée plus tard y tourne sans qu'on touche à ce fichier. La recette
          # écrit la durée de chaque partie.
          - groupe: menus 1
            recettes: test:mobile-menus
            menus: voyage
          - groupe: menus 2
            recettes: test:mobile-menus
            sauf: voyage
          # Les recettes des premières versions qui passent encore : hors de la CI, quatorze
          # autres avaient pourri sans que personne le voie. L'expédition les rejoint : ce
          # groupe était le plus court.
          - groupe: règles et rendu
            site: true
            recettes: >-
              test:rewards test:journey test:missions:regressions test:medical-persistence
              test:stage test:render-settings test:tactical test:expedition
          # Ce qu'un enfant garde, sur le paquet de l'application : la mise à jour par-dessus
          # l'appareil figé d'un testeur du build 63, le fichier familial, la fermeture
          # forcée, les doubles appuis (étape d'hygiène du 21 novembre 2026), la question pour
          # adulte avant le partage (décision 3 du 23 novembre 2026). Chromium n'a pas le
          # partage d'Android : les recettes qui font sortir un fichier le prennent sur le
          # paquet du site, construit ici aussi, ou imitent le côté Android.
          - groupe: sauvegardes
            site: true
            android: true
            recettes: >-
              test:saves:update test:saves:family test:saves:forced-close
              test:saves:double-taps test:failure test:saves:unkept test:saves:gate
          # Le bouton « retour » d'Android (24 novembre 2026), sur le paquet de l'application
          # avec un faux côté Android. La recette joue une aventure entière : avec les
          # sauvegardes, la tâche touchait sa limite de 30 minutes (28 minutes mesurées).
          - groupe: retour
            site: true
            android: true
            recettes: test:back-button
    name: recettes (${{ matrix.groupe }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - if: matrix.site
        run: npm run build
      - if: matrix.android
        run: npm run build:android
      - name: Recettes
        env:
          MOBILE_MENUS_ONLY: ${{ matrix.menus }}
          MOBILE_MENUS_EXCEPT: ${{ matrix.sauf }}
        run: |
          for recette in ${{ matrix.recettes }}; do
            echo "::group::$recette"
            npm run "$recette"
            echo "::endgroup::"
          done
