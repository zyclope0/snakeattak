name: Verify game
# Une fois par commit : à chaque PR, et sur main après une fusion. « portée » d'abord
# (quelques secondes), puis six tâches en parallèle au lieu d'une file de 17 étapes : la
# plus longue fixe la durée de l'ensemble. Sept vérifications à lire sur une PR de code.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  # Un nouveau commit sur une PR remplace la vérification du précédent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portee:
    # Une PR qui ne touche que des documents (`*.md` à la racine ou sous `docs/`, hors
    # `docs/publication/`, le dossier Play, par prudence) ne lance que `npm run verify` :
    # format, tests unitaires, build. Tout le reste, et toute fusion dans main, lance tout.
    # Dans le doute tout tourne : les tâches ne sautent que si « complet » vaut `false`.
    name: portée
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      complet: ${{ steps.fichiers.outputs.complet }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit de fusion d'une PR et ses deux parents : le premier est la base.
          fetch-depth: 2
      - id: fichiers
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          complet=true
          if [ "$EVENEMENT" = pull_request ]; then
            # Sans détection des renommages : un fichier déplacé vers docs/ montre aussi
            # l'endroit d'où il vient.
            fichiers=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf '%s\n' "$fichiers"
            if [ -n "$fichiers" ] && ! grep -qvE '^([^/]+|docs/.+)\.md$' <<<"$fichiers" \
              && ! grep -q '^docs/publication/' <<<"$fichiers"; then
              complet=false
            fi
          fi
          echo "complet=$complet" | tee -a "$GITHUB_OUTPUT"
  verify:
    # Format, tests unitaires, build, puis le jeu dans le navigateur sous ses deux formes.
    needs: portee
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPLET: ${{ needs.portee.outputs.complet }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: env.COMPLET != 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: env.COMPLET != 'false'
        run: npm run test:android-signatures
      - if: env.COMPLET != 'false'
        run: npm audit --omit=dev --audit-level=high
      # Ubuntu already carries Chromium's system libraries. Probe first instead of
      # blocking every release on an unnecessary package-mirror update.
      - if: env.COMPLET != 'false'
        uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - if: env.COMPLET != 'false'
        run: npm run test:browser
      - if: env.COMPLET != 'false'
        run: npm run test:discovery
      - if: env.COMPLET != 'false'
        run: npm run build:ads-preview
      - if: env.COMPLET != 'false'
        run: npm run test:ads-preview
      - if: env.COMPLET != 'false'
        run: npm run build:ads-test
      - if: env.COMPLET != 'false'
        run: npm run test:ads-delivery
      - if: env.COMPLET != 'false'
        run: npm run build:android
      - if: env.COMPLET != 'false'
        run: npm run test:android-web
      - if: env.COMPLET != 'false'
        run: npm run build:portable
      - if: env.COMPLET != 'false'
        run: npm run test:family
      - if: env.COMPLET != 'false'
        run: GAME_URL="file://$PWD/dist-portable/index.html" npm run test:browser
  recettes:
    # Les recettes navigateur, réparties en groupes. `test:render` reste un outil à lancer à
    # la main : il mesure une vitesse, qui dépend de la machine.
    needs: portee
    if: needs.portee.outputs.complet != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `site` : le groupe lit le site construit (`vite preview`). Les autres servent les
        # sources, ou construisent eux-mêmes (`test:caprices`).
        include:
          - groupe: écrans
            site: true
            recettes: >-
              test:audit test:threat-preparation test:reinforcements-scroll test:child-mobile
              test:interruptions test:offline test:presentation test:tactical-clarity
              test:mission-journey test:endless
          - groupe: langue et caprices
            recettes: test:locale test:caprices
          # La recette des menus est la plus longue : la partie « voyage » pèse à peu près
          # autant que toutes les autres, elle a sa tâche. L'autre prend « tout sauf voyage » :
          # une partie ajoutée plus tard y tourne sans qu'on touche à ce fichier. La recette
          # écrit la durée de chaque partie.
          - groupe: menus 1
            recettes: test:mobile-menus
            menus: voyage
          - groupe: menus 2
            recettes: test:mobile-menus
            sauf: voyage
          # Les recettes des premières versions qui passent encore : hors de la CI, quatorze
          # autres avaient pourri sans que personne le voie. L'expédition les rejoint : ce
          # groupe était le plus court.
          - groupe: règles et rendu
            site: true
            recettes: >-
              test:rewards test:journey test:missions:regressions test:medical-persistence
              test:stage test:render-settings test:tactical test:expedition
    name: recettes (${{ matrix.groupe }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - if: matrix.site
        run: npm run build
      - name: Recettes
        env:
          MOBILE_MENUS_ONLY: ${{ matrix.menus }}
          MOBILE_MENUS_EXCEPT: ${{ matrix.sauf }}
        run: |
          for recette in ${{ matrix.recettes }}; do
            echo "::group::$recette"
            npm run "$recette"
            echo "::endgroup::"
          done
