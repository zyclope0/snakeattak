<dialog id="threat-dialog" aria-labelledby="threat-title">
  <div class="threat-dialog-body">
    <span class="eyebrow">Avant de lancer</span>
    <h2 id="threat-title" tabindex="-1">Les serpents annoncés</h2>
    <p id="threat-lanes"></p>
    <div id="wave-threat-list" class="threat-cards"></div>
    <div id="wave-threat-eggs" class="threat-egg"></div>
    <div id="wave-threat-advice" class="scout-advice"></div>
    <p id="threat-route-note">
      Ils peuvent passer par les voies ouvertes ; les serpents peuvent changer de voie.
    </p>
  </div>
  <div class="threat-dialog-actions">
    <button id="threat-close" class="primary">Retour au camp</button>
  </div>
</dialog>
