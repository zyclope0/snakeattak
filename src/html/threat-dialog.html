<dialog id="threat-dialog" aria-labelledby="threat-title">
  <div class="threat-dialog-body">
    <span class="eyebrow">{{avantDeLancer}}</span>
    <h2 id="threat-title" tabindex="-1">{{lesSerpentsAnnonces}}</h2>
    <p id="threat-lanes"></p>
    <div id="wave-threat-list" class="threat-cards"></div>
    <div id="wave-threat-eggs" class="threat-egg"></div>
    <div id="wave-threat-advice" class="scout-advice"></div>
    <p id="threat-route-note">{{ilsPeuventPasserParLesVoies}}</p>
  </div>
  <div class="threat-dialog-actions">
    <button id="threat-close" class="primary">{{retourAuCamp}}</button>
  </div>
</dialog>
