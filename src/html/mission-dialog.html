<dialog id="mission-dialog" aria-labelledby="mission-title">
  <div class="mission-dialog-body">
    <span class="eyebrow">{{tonProchainDefi}}</span>
    <h2 id="mission-title" tabindex="-1"></h2>
    <p id="mission-objective"></p>

    <div class="mission-overview">
      <div class="mission-terrain">
        <div id="mission-advice" class="scout-advice"></div>
        <svg
          id="mission-map"
          viewBox="0 70 1100 510"
          role="img"
          aria-label="{{apercuDesTroisVoiesEtDeLeurs}}"
        ></svg>
        <strong id="mission-budget"></strong>
        <div id="mission-party" aria-label="{{unNouveauHerosEtDeuxNouveaux}}"></div>
      </div>
      <section class="mission-scouting" aria-labelledby="mission-scout-title">
        <h3 id="mission-scout-title">{{dansCetteMission}}</h3>
        <div id="mission-threats" class="threat-cards"></div>
        <details id="mission-more-threats">
          <summary id="mission-more-title">{{lesAutresSerpents}}</summary>
          <div id="mission-other-threats" class="threat-cards"></div>
        </details>
      </section>
    </div>
    <dl class="mission-facts">
      <div>
        <dt data-fact="land">{{terrain}}</dt>
        <dd id="mission-land"></dd>
      </div>
      <div>
        <dt data-fact="assault">{{attaques}}</dt>
        <dd id="mission-assault"></dd>
      </div>
      <div>
        <dt data-fact="nest">{{oeufs}}</dt>
        <dd id="mission-nest"></dd>
      </div>
    </dl>
    <p id="mission-replacement-note" class="mission-replacement-note" hidden>
      {{ceDepartRemplaceTaMissionEnCours}}
    </p>
    <details id="mission-parent-options">
      <summary>{{pourLesParents}}</summary>
      <div class="departure-share" hidden>
        <label for="mission-departure-code">{{codeDeCeDepart}}</label>
        <div class="departure-entry">
          <input
            id="mission-departure-code"
            class="departure-value"
            readonly
            aria-describedby="mission-departure-message"
          /><button id="mission-departure-copy" class="secondary" type="button">
            {{copier}}
          </button>
        </div>
        <p id="mission-departure-message" class="departure-message" role="status"></p>
      </div>
      <button id="mission-retry" class="secondary" hidden>{{retrouverMonDernierDepart}}</button>
      <p id="mission-plan"></p>
      <p class="mission-save-note">{{tonCampClassiqueEstConserveCe}}</p>
    </details>
  </div>
  <div class="mission-dialog-actions">
    <button id="mission-launch" class="primary">{{cEstParti2}}</button
    ><button id="mission-reroll" class="secondary">{{autreDepart}}</button
    ><button id="mission-close" class="secondary">{{retour}}</button>
  </div>
</dialog>
