<dialog id="family-dialog" aria-labelledby="family-title">
  <h2 id="family-title">{{tonAventureAGarder}}</h2>
  <p>{{leFichierGardeLeDernierCampPrepare}}</p>
  <button id="family-export" class="primary">{{exporterMonAventure}}</button>
  <p id="family-export-status" role="status" tabindex="-1"></p>
  <label for="family-file">{{retrouverUnFichierFamilial}}</label>
  <input id="family-file" type="file" accept=".json,application/json" hidden />
  <button id="family-choose-file" class="secondary" type="button" aria-controls="family-file">
    {{choisirUnFichier}}
  </button>
  <span id="family-file-name" role="status"></span>
  <section id="family-preview" hidden>
    <h3>{{ceFichierContient}}</h3>
    <p id="family-preview-summary"></p>
    <p>{{ilRemplaceraLeCampLesEtoilesEtLes}}</p>
    <button id="family-apply" class="primary" disabled>{{remplacerMonAventure}}</button>
  </section>
  <p id="family-status" role="status"></p>
  <button id="family-close" class="secondary">{{garderMonAventureEtRevenir}}</button>
</dialog>
<dialog id="journey-confirm" aria-labelledby="journey-confirm-title">
  <h2 id="journey-confirm-title">{{remplacerLeCampActuel}}</h2>
  <p>{{lesMeilleuresEtoilesEtTesFavoris}}</p>
  <div class="dialog-actions">
    <button id="journey-cancel" autofocus>{{garderMonCamp}}</button
    ><button id="journey-replace" class="primary">{{recommencerIci}}</button>
  </div>
</dialog>
